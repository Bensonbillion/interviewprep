name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.TEST_SERVICE_ROLE_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.TEST_ANTHROPIC_KEY }}
  DATA_ENCRYPTION_KEY: ${{ secrets.TEST_ENCRYPTION_KEY }}
  UPSTASH_REDIS_REST_URL: ${{ secrets.TEST_UPSTASH_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.TEST_UPSTASH_TOKEN }}

jobs:
  # JOB 1: Lint + Type Check (fast, catches obvious errors)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true # @types/mdx JSX namespace issue

  # JOB 2: Security Scanning (parallel with lint)
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # JOB 3: Unit + Integration + Security + AI Tests (after lint passes)
  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit -- --reporter=verbose
      - name: Integration tests
        run: npm run test:integration -- --reporter=verbose
      - name: Security tests
        run: npm run test:security -- --reporter=verbose
      - name: AI voice profile tests
        run: npm run test:ai -- --reporter=verbose
      - name: SEO tests
        run: npx vitest run tests/seo -- --reporter=verbose
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # JOB 4: E2E Tests (after unit tests pass)
  e2e-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    env:
      TEST_USER_ACCESS_TOKEN: ${{ secrets.TEST_USER_ACCESS_TOKEN }}
      TEST_USER_REFRESH_TOKEN: ${{ secrets.TEST_USER_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build Next.js
        run: npm run build
      - name: Run E2E tests (Desktop Chrome only in CI)
        run: npm run test:e2e -- --project="Desktop Chrome"
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
