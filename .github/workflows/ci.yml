name: CI

on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck + Lint + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx next build --no-lint || true
      - run: npm run lint
      - run: npm run test:unit -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  db-tests:
    name: Database Tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db

  e2e:
    name: E2E Tests (Playwright)
    needs: [static]
    runs-on: ubuntu-latest
    # Real blocking gate as of the ci-hygiene session. Vercel Protection
    # Bypass for Automation is wired through extraHTTPHeaders in
    # playwright.config.ts via VERCEL_AUTOMATION_BYPASS_SECRET — preview
    # SSO is no longer in front of the tests.
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Get Playwright version
        id: pw
        run: echo "v=$(node -e 'console.log(require("@playwright/test/package.json").version)')" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.v }}
      - run: npx playwright install --with-deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
      # patrickedqvist/wait-for-vercel-preview@v1.3.2 hit its 600s timeout
      # on every shard of every PR run (last verified 2026-06-05 across
      # three reruns on insight-interview-universal, with Vercel check
      # showing pass). Replaced with a direct GitHub Deployments API poll
      # so the gate stops training us to ignore it. Polls every 15s for
      # up to 10 minutes, filtering on vercel[bot] + environment success.
      - name: Wait for Vercel preview URL
        id: vercel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "Resolving Vercel preview for sha=$sha"
          for attempt in $(seq 1 40); do
            deployment_id=$(gh api "repos/${{ github.repository }}/deployments?sha=$sha&per_page=100" \
              --jq '.[] | select(.creator.login=="vercel[bot]") | .id' 2>/dev/null | head -n1 || true)
            if [ -n "$deployment_id" ]; then
              preview_url=$(gh api "repos/${{ github.repository }}/deployments/$deployment_id/statuses" \
                --jq '.[] | select(.state=="success") | .environment_url' 2>/dev/null | head -n1 || true)
              if [ -n "$preview_url" ]; then
                echo "url=$preview_url" >> "$GITHUB_OUTPUT"
                echo "Resolved preview after attempt ${attempt}: $preview_url"
                exit 0
              fi
            fi
            echo "Attempt $attempt/40: no successful Vercel deployment yet for $sha — sleeping 15s"
            sleep 15
          done
          echo "::error::No successful Vercel preview deployment for $sha after 600s"
          exit 1
      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shard }}
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ steps.vercel.outputs.url }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/

  evals:
    name: AI Quality Evals (Nightly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[run-evals]')
    needs: [e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx tests/evals/run-evals.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLAYWRIGHT_TEST_BASE_URL: ${{ secrets.PROD_URL }}
